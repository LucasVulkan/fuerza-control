<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoja de límite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&family=Barlow:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* Maqueta M04-01 (v3, 27-oct): hoja alta y centrada, a partir de una
     referencia del usuario. Bloque central (icono → contador → título → texto)
     y botones abajo, con espacios por niveles: grandes entre grupos, pequeños
     dentro. Sin acciones secundarias (decidido 27-oct): solo «Ahora no» y
     «Hazte PRO». Valores de src/themes.js (formaFit). */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f; --surface: #1f1f1f; --surface2: #272727; --text: #e6e6e6;
    --mutedLight: #949494; --muted: #585858; --border: #3a3a3a;
    --accent: #aae216; --onAccent: #000; --accent10: rgba(170,226,22,.1); --page: #070707; color-scheme: dark;
  }
  body { background: var(--page); color: var(--text); font-family: Inter, system-ui, sans-serif;
    padding: 32px max(16px, env(safe-area-inset-left, 0px)) 80px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font: 900 22px Inter; margin-bottom: 6px; }
  .lead { color: var(--mutedLight); font: 500 14px/1.55 Inter; max-width: 70ch; margin-bottom: 20px; }
  .lead b { color: var(--text); }
  .ctl { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .ctl button { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 7px 11px; font: 800 12px Inter; cursor: pointer; }
  .ctl button.on { border-color: var(--accent); color: var(--accent); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stage { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; margin-top: 20px; }
  .note { max-width: 380px; color: var(--mutedLight); font: 500 13px/1.55 Inter; display: grid; gap: 10px; }
  .note b { color: var(--text); }

  .phone { width: 375px; max-width: 100%; height: 760px; background: var(--bg); border-radius: 28px; border: 1px solid #1a1a1a;
    overflow: hidden; position: relative; }
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,.6); }

  /* hoja alta: ocupa casi toda la pantalla */
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 64px; background: var(--surface); border-radius: 18px 18px 0 0;
    padding: 10px 16px 20px; display: flex; flex-direction: column; text-align: center; }
  .grab { width: 36px; height: 4px; border-radius: 2px; background: var(--muted); margin: 0 auto; flex: none; }

  /* bloque central: centrado en el hueco libre */
  .mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 12px; }
  .icon { width: 88px; height: 88px; border-radius: 44px; background: var(--accent10); display: grid; place-items: center; }
  .icon svg { width: 40px; height: 40px; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .icon .g { stroke: var(--mutedLight); } .icon .a { stroke: var(--accent); }
  .pill { margin-top: 24px; background: var(--accent10); color: var(--accent); border-radius: 9999px; padding: 5px 12px;
    font: 700 13px Barlow; letter-spacing: 1.4px; text-transform: uppercase; font-variant-numeric: tabular-nums; }
  .title { margin-top: 12px; font: 800 22px/1.25 Inter; letter-spacing: -.3px; max-width: 290px; }
  .say { margin-top: 8px; font: 500 15px/1.5 Inter; color: var(--mutedLight); max-width: 300px; }
  .say b { color: var(--text); font-weight: 700; }

  /* botones abajo: el secundario arriba, PRO al fondo, como la referencia */
  .btns { flex: none; display: grid; gap: 4px; }
  .later { background: none; border: 0; color: var(--text); font: 700 15px Inter; padding: 14px; cursor: pointer; width: 100%; }
  .cta { background: var(--accent); color: var(--onAccent); border: 0; border-radius: 10px; padding: 12px 14px; cursor: pointer; width: 100%; margin-top: 4px; }
  .cta b { display: block; font: 800 16px Inter; }
  .cta small { display: block; font: 600 13px Inter; opacity: .7; margin-top: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>M04-01 · Hoja de límite <span style="color:var(--muted)">v3</span></h1>
  <p class="lead">Sale al tocar algo que el plan gratis no deja, <b>antes del paywall</b>. Hoja alta y centrada: icono, contador, título y texto juntos en el centro;
    los botones abajo. «Hazte PRO» abre el paywall con esa ventaja la primera.</p>
  <div class="ctl" id="reasons"></div>
  <div class="stage">
    <div class="phone">
      <div class="scrim"></div>
      <div class="sheet" id="sheet"></div>
    </div>
    <div class="note" id="note"></div>
  </div>
</div>

<script>
const ICONS = {
  users:  '<circle class="g" cx="9" cy="8" r="3.5"/><path class="g" d="M3 20c.5-3.5 3-5.5 6-5.5s5.5 2 6 5.5"/><path class="a" d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c1.7.8 2.8 2.7 3 5.5"/>',
  phone:  '<rect class="g" x="7" y="3" width="10" height="18" rx="2"/><path class="a" d="M11 17h2"/>',
  tpl:    '<rect class="g" x="4" y="3" width="16" height="18" rx="2"/><path class="a" d="M8 8h8M8 12h8M8 16h5"/>',
  pause:  '<circle class="g" cx="12" cy="12" r="9"/><path class="a" d="M10 9v6M14 9v6"/>',
};
const R = {
  clients: {
    label: 'Clientes', icon: 'users', pill: '3/3 clientes', title: 'Límite de clientes alcanzado',
    say: 'Has alcanzado el límite de <b>3 clientes</b> del plan gratis. Hazte PRO para añadir más.', pro: 'Clientes ilimitados',
  },
  connected: {
    label: 'Con la app', icon: 'phone', pill: '1/1 con la app', title: 'Límite de clientes con la app alcanzado',
    say: 'Has alcanzado el límite de <b>1 cliente con la app</b>. Al resto les apuntas tú los entrenos.', pro: 'Todos tus clientes con la app',
  },
  programTemplates: {
    label: 'Plantilla de programa', icon: 'tpl', pill: '1/1 plantillas', title: 'Límite de plantillas alcanzado',
    say: 'Has alcanzado el límite de <b>1 plantilla de programa</b>.', pro: 'Plantillas ilimitadas',
  },
  sessionTemplates: {
    label: 'Plantilla de sesión', icon: 'tpl', pill: '1/1 plantillas', title: 'Límite de plantillas alcanzado',
    say: 'Has alcanzado el límite de <b>1 plantilla de sesión</b>.', pro: 'Plantillas ilimitadas',
  },
  frozen: {
    label: 'Cliente en pausa', icon: 'pause', pill: 'En pausa', title: 'Límite de clientes alcanzado',
    say: '<b>Ana</b> está fuera de tus 3 clientes activos. Puedes ver su historial, pero no cambiar nada.', pro: 'Todos tus clientes activos',
  },
};
let reason = 'clients';
function render() {
  const r = R[reason];
  document.getElementById('sheet').innerHTML = `<div class="grab"></div>
    <div class="mid"><div class="icon"><svg viewBox="0 0 24 24">${ICONS[r.icon]}</svg></div>
      <div class="pill">${r.pill}</div><div class="title">${r.title}</div><p class="say">${r.say}</p></div>
    <div class="btns"><button class="later">Ahora no</button>
      <button class="cta"><b>Hazte PRO</b><small>${r.pro}</small></button></div>`;
  document.getElementById('note').innerHTML = `
    <p><b>Espacios por niveles:</b> icono → contador 24, contador → título 12, título → texto 8 (lo que va junto, más cerca). El bloque se centra en el hueco que dejan los botones.</p>
    <p><b>Botones abajo:</b> «Ahora no» en texto encima y «Hazte PRO» al fondo, con la línea de lo que desbloquea dentro del botón.</p>
    <p><b>Sin degradado:</b> la referencia lo lleva arriba, pero ya lo descartaste en la app («etéreo»); el color lo pone el círculo con tinte lima.</p>
    <p>Las cifras salen de <b>FREE</b>, <b>templateCounts</b> e <b>isConnected</b>. Sin acciones secundarias: solo «Ahora no» y «Hazte PRO».</p>`;
  for (const b of document.querySelectorAll('#reasons button')) b.classList.toggle('on', b.dataset.k === reason);
}
const el = document.getElementById('reasons');
for (const [k, v] of Object.entries(R)) {
  const b = document.createElement('button'); b.textContent = v.label; b.dataset.k = k;
  b.onclick = () => { reason = k; render(); }; el.appendChild(b);
}
render();
</script>
</body>
</html>
