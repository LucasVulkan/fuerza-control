<style>
/* Layout: índice de pantallas a la izquierda; cada pantalla = captura grande + sus textos con la versión nueva al lado. */
:root {
  --bg: #f6f7f2; --panel: #ffffff; --fg: #1b1d17; --muted: #6b6f62; --line: #e1e3d9;
  --accent: #5d7d00; --accent-soft: #eef6d2; --warn: #fff3dc; --warn-fg: #7a4b00; --shot: #10110e;
  --sans: "Instrument Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121310; --panel: #1b1d18; --fg: #ecede6; --muted: #9a9e90; --line: #2c2f27;
  --accent: #b9e425; --accent-soft: #273110; --warn: #33270f; --warn-fg: #f2c46b; --shot: #000; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121310; --panel: #1b1d18; --fg: #ecede6; --muted: #9a9e90; --line: #2c2f27;
  --accent: #b9e425; --accent-soft: #273110; --warn: #33270f; --warn-fg: #f2c46b; --shot: #000; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--sans); }
button, select, textarea { font: inherit; color: inherit }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding: 10px 16px; flex-wrap: wrap }
.top h1 { font-size: 17px; margin: 0; font-weight: 700; letter-spacing: -.01em }
.top .count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums }
.top .sp { flex: 1 }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; cursor: pointer }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600 }
.btn:focus-visible, textarea:focus-visible, a:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
#jump { display: none; max-width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel) }

.wrap { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 0; min-height: 100% }
nav { border-right: 1px solid var(--line); padding: 12px 8px 40px; position: sticky; top: 57px; align-self: start; max-height: calc(100vh - 57px); overflow-y: auto }
nav h3 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 8px 4px; font-weight: 600 }
nav a { display: flex; gap: 8px; align-items: baseline; padding: 4px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; font-size: 14px }
nav a:hover { background: var(--accent-soft) }
nav a.on { background: var(--accent); color: var(--bg) }
nav a .n { font-family: var(--mono); font-size: 11px; color: var(--muted); min-width: 34px }
nav a.on .n { color: inherit }
nav a .b { margin-left: auto; font-size: 11px; font-weight: 600; background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 0 7px }
nav a.on .b { background: var(--bg); }

main { padding: 20px 24px 60px; min-width: 0 }
.head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px }
.head .area { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
.head h2 { margin: 0; font-size: 26px; letter-spacing: -.02em; text-wrap: balance }
.head .pos { color: var(--muted); font-family: var(--mono); font-size: 12px }
.head .nav2 { margin-left: auto; display: flex; gap: 8px }
.screen { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 28px; align-items: start }
.shot { position: sticky; top: 76px; background: var(--shot); border-radius: 22px; padding: 8px; cursor: zoom-in }
.shot img { display: block; width: 100%; border-radius: 15px }
.shot .hint { position: absolute; right: 16px; bottom: 16px; font-size: 12px; background: rgba(0,0,0,.6); color: #fff; padding: 2px 8px; border-radius: 6px }

.warn { background: var(--warn); color: var(--warn-fg); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; font-size: 14px }
.warn b { display: block; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px }
.warn ul { margin: 0; padding-left: 18px }
.texts { display: grid; gap: 10px }
.t { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 8px }
.t.changed { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent) }
.t .orig { white-space: pre-wrap; overflow-wrap: anywhere }
.t .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-family: var(--mono); font-size: 11px; color: var(--muted) }
.t .meta .hard { font-family: var(--sans); background: var(--warn); color: var(--warn-fg); padding: 0 6px; border-radius: 4px }
.t .meta .also { font-family: var(--sans) }
.t textarea { width: 100%; min-height: 40px; resize: vertical; border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; background: var(--bg) }
.t textarea:not(:placeholder-shown) { border-style: solid; border-color: var(--accent) }
.t .who { font-size: 12px; color: var(--muted) }
.empty { color: var(--muted) }
.status { font-size: 12px; color: var(--muted) }

#zoom { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.88); overflow: auto; cursor: zoom-out; padding: 16px; display: flex; justify-content: center; align-items: flex-start }
#zoom img { max-width: min(720px, 100%); height: auto; border-radius: 12px }

@media (max-width: 900px) {
  .wrap { grid-template-columns: 1fr }
  nav { display: none }
  #jump { display: block; flex-basis: 100% }
  main { padding: 16px }
  .screen { grid-template-columns: 1fr }
  .shot { position: static; max-width: 420px; margin: 0 auto; width: 100% }
  .head .nav2 { margin-left: 0 }
}
@media (prefers-reduced-motion: no-preference) { .t { transition: border-color .15s } }
</style>

<div class="top">
  <h1>Copy de Forma Fit</h1>
  <span class="count" id="count"></span>
  <span class="sp"></span>
  <span class="status" id="status"></span>
  <button class="btn" id="copy">Copiar cambios</button>
  <select id="jump" aria-label="Ir a pantalla"></select>
</div>
<div class="wrap">
  <nav id="nav" aria-label="Pantallas"></nav>
  <main id="main"></main>
</div>
<div id="zoom" hidden><img alt=""></div>

eTabsHint","text":"Una sola tarjeta en Inicio, con una pestaña por sesión"},{"key":"header.scrubRulerLabel","text":"Regla al deslizar"},{"key":"header.scrubRulerHint","text":"KG, reps y RPE se ajustan sobre una regla"},{"key":"header.sectionAccount","text":"CUENTA"},{"key":"header.planRow","text":"Plan"},{"key":null,"text":"PRO"},{"key":"header.docsRow","text":"Documentación"},{"key":"header.deleteAccountRow","text":"Eliminar mi cuenta"},{"key":"header.deleteAccountSub","text":"Borra tu cuenta y lo que haya en el servidor. No se puede deshacer."},{"key":"header.sectionDeveloper","text":"DESARROLLADOR"},{"key":"header.plan","text":"Plan:"},{"key":"header.switchToFree","text":"Cambiar a FREE"}],"warn":["010 (Sesiones en pestañas): la descripción se corta con «…»: «Una sola tarjeta en Inicio, con una pestaña por s...» (009c-peso-corporal.png, 010)"]},{"id":"011a-paywall","num":"011a","title":"Paywall (Forma Pro)","texts":[{"key":null,"text":"PRO"},{"key":"paywall.headline","text":"Conecta con\ntodos tus\n*clientes*"},{"key":null,"text":"TODOS TUS CLIENTES"},{"key":"paywall.tagline","text":"UNA APP PARA ENTRENARLOS A TODOS"},{"key":"paywall.features.connected.title","text":"Todos tus clientes *sincronizados*"},{"key":"paywall.features.connected.desc","text":"Tú programas, ellos entrenan. Todo sincronizado sin salir de la app."},{"key":"paywall.features.clients.title","text":"*Sin límite* de clientes"},{"key":"paywall.features.clients.desc","text":"El plan gratis llega a 3."},{"key":"paywall.features.templates.title","text":"*Sin límite* de plantillas"},{"key":"paywall.features.templates.desc","text":"Crea programas y sesiones listos para asignar."},{"key":"paywall.payTitle","text":"Forma de pago"},{"key":"paywall.comingSoon","text":"Forma Pro próximamente"},{"key":"paywall.restore","text":"Restaurar compra"},{"key":"paywall.terms","text":"Términos de uso"},{"key":"paywall.privacy","text":"Privacidad"}],"warn":["011 (Paywall): «Forma Pro próximamente» junto a la sección «Forma de pago» — contradice que haya compra. (011a-paywall.png)"]},{"id":"012a-documentacion","num":"012a","title":"Documentación · 1","texts":[{"key":"header.sectionAccount","text":"CUENTA"},{"key":"docs.title","text":"Documentación"},{"key":"docs.intro","text":"Cómo se organiza el entrenamiento en la app y qué significa cada término. Los cuatro primeros —sesión, semana, etapa y programa— encajan unos dentro de otros: cada uno agrupa al anterior."},{"key":"docs.sections.0.title","text":"Sesión"},{"key":"docs.sections.0.points.0","text":"Un día de entrenamiento: los ejercicios que haces de una sentada."},{"key":"docs.sections.0.points.1","text":"Dentro de la etapa se nombran por orden: A, B, C…"},{"key":"docs.sections.0.points.2","text":"La letra dice cuándo toca, no qué es: al reordenarlas, se reasignan."},{"key":"docs.sections.1.title","text":"Sesión libre"},{"key":"docs.sections.1.points.0","text":"Una sesión fuera del programa: movilidad, agarre, la de un día de hotel. Puedes improvisarla o guardarla y tenerla en Inicio."},{"key":"docs.sections.1.points.1","text":"No toca el programa: sus pesos progresan por su cuenta y no avanza la semana ni la etapa."},{"key":"docs.sections.1.points.2","text":"Si sustituye a una sesión, márcalo al acabar con «Cuenta para el programa»: cuenta como esa sesión en la semana, la etapa y la adherencia."},{"key":"docs.sections.1.points.3","text":"La carga la cuenta siempre: el cansancio es real aunque la sesión no sea del programa."},{"key":"docs.sections.2.title","text":"Semana"},{"key":"docs.sections.2.points.0","text":"Cada semana se hacen las sesiones de la etapa: si tiene A, B y C, son tres entrenos por semana. En entrenamiento, el microciclo."},{"key":"docs.sections.2.points.1","text":"Son semanas de calendario, de lunes a domingo."},{"key":"docs.sections.2.points.2","text":"La primera sesión de una etapa la empieza. Si es de lunes a miércoles, esa semana ya cuenta; de jueves a domingo, la semana 1 empieza el lunes siguiente, y lo que entrenes antes suma igual."},{"key":"docs.sections.2.points.3","text":"La sesión que toca es la que más tiempo llevas sin hacer. Si el programa empieza cada semana por la A, la primera que no has hecho esta semana; y si es libre, no toca ninguna."}],"warn":["012 (Documentación): «For time: un trabajo fijo, lo más rápido posible.» — término en inglés. (012b-documentacion.png)","012 (Documentación): «Recomendación de progresión … (SIMPLIFICADO)» — revisar."]},{"id":"012b-documentacion","num":"012b","title":"Documentación · 2","texts":[{"key":"header.sectionAccount","text":"CUENTA"},{"key":"docs.title","text":"Documentación"},{"key":"docs.sections.2.title","text":"Semana"},{"key":"docs.sections.2.points.2","text":"La primera sesión de una etapa la empieza. Si es de lunes a miércoles, esa semana ya cuenta; de jueves a domingo, la semana 1 empieza el lunes siguiente, y lo que entrenes antes suma igual."},{"key":"docs.sections.2.points.3","text":"La sesión que toca es la que más tiempo llevas sin hacer. Si el programa empieza cada semana por la A, la primera que no has hecho esta semana; y si es libre, no toca ninguna."},{"key":"docs.sections.3.title","text":"Etapa"},{"key":"docs.sections.3.points.0","text":"Tramo del programa con un objetivo: acumular volumen, ganar fuerza, afinar. En entrenamiento, el mesociclo."},{"key":"docs.sections.3.points.1","text":"Dura un número de semanas, y cada semana se hacen todas sus sesiones."},{"key":"docs.sections.3.points.2","text":"Al acabar, la app mira si hiciste las sesiones que tocaban. Si faltan por valor de una semana o más, te propone alargarla; puedes avanzar igualmente."},{"key":"docs.sections.3.points.3","text":"Si en la última semana ya las has hecho todas, puedes pasar a la siguiente antes. Nunca salta sola."},{"key":"docs.sections.3.points.4","text":"Son lo que permite que un programa evolucione en vez de repetir siempre lo mismo."},{"key":"docs.sections.4.title","text":"Programa"},{"key":"docs.sections.4.points.0","text":"El plan completo de principio a fin: todas sus etapas juntas. En entrenamiento, el macrociclo."},{"key":"docs.sections.4.points.1","text":"Solo hay uno activo a la vez."},{"key":"docs.sections.4.points.2","text":"Los demás quedan archivados y puedes recuperarlos cuando quieras."},{"key":"docs.sections.5.title","text":"Bloque"},{"key":"docs.sections.5.points.0","text":"Trabajo de acondicionamiento con reloj en vez de series."},{"key":"docs.sections.5.points.1","text":"AMRAP: máximas rondas en un tiempo."},{"key":"docs.sections.5.points.2","text":"EMOM: una tarea por minuto."},{"key":"docs.sections.5.points.3","text":"For time: un trabajo fijo, lo más rápido posible."}],"warn":["012 (Documentación): «For time: un trabajo fijo, lo más rápido posible.» — término en inglés. (012b-documentacion.png)","012 (Documentación): «Recomendación de progresión … (SIMPLIFICADO)» — revisar."]},{"id":"012c-documentacion","num":"012c","title":"Documentación · 3","texts":[{"key":"header.sectionAccount","text":"CUENTA"},{"key":"docs.title","text":"Documentación"},{"key":"docs.sections.5.title","text":"Bloque"},{"key":"docs.sections.5.points.0","text":"Trabajo de acondicionamiento con reloj en vez de series."},{"key":"docs.sections.5.points.1","text":"AMRAP: máximas rondas en un tiempo."},{"key":"docs.sections.5.points.2","text":"EMOM: una tarea por minuto."},{"key":"docs.sections.5.points.3","text":"For time: un trabajo fijo, lo más rápido posible."},{"key":"docs.sections.6.title","text":"Superserie"},{"key":"docs.sections.6.points.0","text":"Dos o más ejercicios encadenados sin descanso entre ellos."},{"key":"docs.sections.6.points.1","text":"El descanso se toma al terminar el último de la cadena."},{"key":"docs.sections.7.title","text":"Dropset"},{"key":"docs.sections.7.points.0","text":"Series extra al final de la última serie, bajando el peso sin descansar."},{"key":"docs.sections.7.points.1","text":"Suman volumen."},{"key":"docs.sections.7.points.2","text":"No cuentan para PRs ni para la progresión."},{"key":"docs.sections.8.title","text":"Progresión"},{"key":"docs.sections.8.points.0","text":"La regla que decide el peso de tu próxima sesión."},{"key":"docs.sections.8.points.1","text":"Automática: sube si cumples el objetivo."},{"key":"docs.sections.8.points.2","text":"Fija: siempre el mismo incremento."},{"key":"docs.sections.8.points.3","text":"Por esfuerzo: pides un RPE y la app calcula el peso con tu 1RM estimado."},{"key":"docs.sections.9.title","text":"RPE"},{"key":"docs.sections.9.points.0","text":"Esfuerzo percibido de 1 a 10."},{"key":"docs.sections.9.points.1","text":"Cuántas repeticiones te habrías dejado en el depósito."},{"key":"docs.sections.9.points.2","text":"Un RPE 8 son unas 2 repeticiones de margen."},{"key":"docs.sections.10.title","text":"1RM"},{"key":"docs.sections.10.points.0","text":"El peso máximo estimado para una sola repetición."},{"key":"docs.sections.10.points.1","text":"No se mide levantándolo: se calcula a partir de tus series."},{"key":"docs.sections.11.title","text":"PR"}],"warn":["012 (Documentación): «For time: un trabajo fijo, lo más rápido posible.» — término en inglés. (012b-documentacion.png)","012 (Documentación): «Recomendación de progresión … (SIMPLIFICADO)» — revisar."]},{"id":"012d-documentacion","num":"012d","title":"Documentación · 4","texts":[{"key":"header.sectionAccount","text":"CUENTA"},{"key":"docs.title","text":"Documentación"},{"key":"docs.sections.10.title","text":"1RM"},{"key":"docs.sections.10.points.0","text":"El peso máximo estimado para una sola repetición."},{"key":"docs.sections.10.points.1","text":"No se mide levantándolo: se calcula a partir de tus series."},{"key":"docs.sections.11.title","text":"PR"},{"key":"docs.sections.11.points.0","text":"Récord personal en un ejercicio."},{"key":"docs.sections.11.points.1","text":"Más peso, más repeticiones con el mismo peso, o más volumen que en cualquier sesión anterior."},{"key":"docs.metricsTitle","text":"Cómo se calcula cada número"},{"key":"docs.metricsIntro","text":"Cada dato que ves en la app sale de una fórmula concreta, y todas tienen un límite. Aquí están las dos cosas."},{"key":"docs.metricGroups.performance","text":"Rendimiento y récords"},{"key":"metrics.e1rm.name","text":"1RM estimado"},{"key":"metrics.e1rm.what","text":"Estima el peso máximo que podrías levantar una sola vez, sin tener que intentarlo de verdad. Sirve para seguir tu progreso en un ejercicio aunque cambies de repeticiones cada semana."},{"key":"docs.metricFormula","text":"Cómo se calcula"},{"key":"metrics.e1rm.formula","text":"1RM estimado = peso × (1 + repeticiones ÷ 30)"},{"key":"docs.metricRules","text":"Reglas de la app"},{"key":"metrics.e1rm.rules","text":"Si registras el RPE, se estima cuántas repeticiones te quedaban en reserva (10 − RPE) y se suman a las hechas antes de aplicar la fórmula: una serie a RPE 8 se calcula como si hubieras hecho dos repeticiones más."},{"key":"docs.metricCaveat","text":"Límites"},{"key":"metrics.e1rm.caveat","text":"Es la fórmula de Epley, una estimación y no una medición. Se ignoran las series de más de {{maxReps}} repeticiones porque a partir de ahí sobreestima de forma notable."},{"key":"metrics.pr.name","text":"Récord personal (PR)"},{"key":"metrics.pr.what","text":"Señala las sesiones en las que superaste tu mejor registro anterior en un ejercicio."}],"warn":["012 (Documentación): «For time: un trabajo fijo, lo más rápido posible.» — término en inglés. (012b-documentacion.png)","012 (Documentación): «Recomendación de progresión … (SIMPLIFICADO)» — revisar."]},{"id":"012e-documentacion","num":"012e","title":"Documentación · 5","texts":[{"key":"header.sectionAccount","text":"CUENTA"},{"key":"docs.title","text":"Documentación"},{"key":"metrics.e1rm.caveat","text":"Es la fórmula de Epley, una estimación y no una medición. Se ignoran las series de más de {{maxReps}} repeticiones porque a partir de ahí sobreestima de forma notable."},{"key":"metrics.pr.name","text":"Récord personal (PR)"},{"key":"metrics.pr.what","text":"Señala las sesiones en las que superaste tu mejor registro anterior en un ejercicio."},{"key":"docs.metricFormula","text":"Cómo se calcula"},{"key":"metrics.pr.formula","text":"se compara el 1RM estimado; si no se puede calcular, el peso máximo; y si tampoco, las repeticiones a peso corporal"},{"key":"docs.metricRules","text":"Reglas de la app"},{"key":"metrics.pr.rules","text":"La comparación es contra todo tu historial anterior, no contra la última sesión. La primera vez que haces un ejercicio establece tu referencia inicial, así que no se considera un récord. Se marca un solo récord por ejercicio y sesión: el primero de esa escalera."},{"key":"docs.metricCaveat","text":"Límites"},{"key":"metrics.pr.caveat","text":"Al apoyarse en el 1RM estimado, hereda su margen de error: un récord ajustado puede venir de la estimación y no de una mejora real."},{"key":"metrics.performanceIndex.name","text":"Rendimiento"},{"key":"metrics.performanceIndex.what","text":"Resume en un solo número cómo ha evolucionado tu rendimiento estimado en todos los ejercicios del período. Sirve para saber si el entrenamiento se está convirtiendo en resultados."},{"key":"metrics.performanceIndex.formula","text":"media de (1RM estimado de cada ejercicio ÷ su valor inicial) × 100"},{"key":"metrics.performanceIndex.rules","text":"Para cada semana se toma el mejor 1RM estimado conseguido en las 4 semanas anteriores, no el de esa semana suelta, para que una descarga no aparezca como pérdida de rendimiento. Un ejercicio entra solo si tiene valor inicial y al menos una semana posterior con datos. Se promedian los índices de cada ejercicio, no los kilos."}],"warn":["012 (Documentación): «For time: un trabajo fijo, lo más rápido posible.» — término en inglés. (012b-documentacion.png)","012 (Documentación): «Recomendación de progresión … (SIMPLIFICADO)» — revisar."]},{"id":"012f-documentacion","num":"012f","title":"Documentación · 6","texts":[{"key":"header.sectionAccount","text":"CUENTA"},{"key":"docs.title","text":"Documentación"},{"key":"docs.metricRules","text":"Reglas de la app"},{"key":"metrics.performanceIndex.rules","text":"Para cada semana se toma el mejor 1RM estimado conseguido en las 4 semanas anteriores, no el de esa semana suelta, para que una descarga no aparezca como pérdida de rendimiento. Un ejercicio entra solo si tiene valor inicial y al menos una semana posterior con datos. Se promedian los índices de cada ejercicio, no los kilos."},{"key":"docs.metricCaveat","text":"Límites"},{"key":"metrics.performanceIndex.caveat","text":"Es rendimiento estimado, no fuerza medida: se apoya por completo en el 1RM estimado. Cambiar de ejercicios a mitad del período mueve el número aunque tu rendimiento no cambie."},{"key":"metrics.loadTrend.name","text":"Mejora"},{"key":"metrics.loadTrend.what","text":"Indica si los pesos que mueves suben o bajan de media en el período, juntando todos tus ejercicios en un porcentaje."},{"key":"docs.metricFormula","text":"Cómo se calcula"},{"key":"metrics.loadTrend.formula","text":"línea de tendencia (regresión lineal) sobre las sesiones de cada ejercicio; el porcentaje es el cambio entre sus extremos, promediado entre ejercicios"},{"key":"metrics.loadTrend.rules","text":"Todos los ejercicios pesan lo mismo en el promedio, independientemente de cuántas sesiones tengan. Cada ejercicio se mide en una sola unidad: en kilos si alguna vez llevó peso, si no en repeticiones. Uno de peso corporal que empieza sin lastre no suma, porque no hay porcentaje sobre 0 kg."},{"key":"metrics.loadTrend.caveat","text":"Es la pendiente de una recta ajustada a todas tus sesiones, no la diferencia entre la primera y la última. Un ejercicio recién estrenado, con pocos puntos, puede mover el resultado más de lo que le corresponde."},{"key":"metrics.lastSessionDelta.name","text":"Diferencia con la sesión anterior"},{"key":"metrics.lastSessionDelta.what","text":"Compara tu última sesión con la anterior del mismo tipo para ver de un vistazo si subiste o bajaste."}],"warn":["012 (Documentación): «For time: un trabajo fijo, lo más rápido posible.» — término en inglés. (012b-documentacion.png)","012 (Documentación): «Recomendación de progresión … (SIMPLIFICADO)» — revisar."]},{"id":"012g-documentacion","num":"012g","title":"Documentación · 7","texts":[{"key":"header.sectionAccount","text":"CUENTA"},{"key":"docs.title","text":"Documentación"},{"key":"metrics.lastSessionDelta.name","text":"Diferencia con la sesión anterior"},{"key":"metrics.lastSessionDelta.what","text":"Compara tu última sesión con la anterior del mismo tipo para ver de un vistazo si subiste o bajaste."},{"key":"docs.metricFormula","text":"Cómo se calcula"},{"key":"metrics.lastSessionDelta.formula","text":"(última − anterior) ÷ anterior × 100"},{"key":"docs.metricRules","text":"Reglas de la app"},{"key":"metrics.lastSessionDelta.rules","text":"En el historial esta diferencia se calcula sobre el volumen y compara con la vez anterior de esa misma sesión, no con la sesión inmediatamente anterior en el tiempo."},{"key":"docs.metricCaveat","text":"Límites"},{"key":"metrics.lastSessionDelta.caveat","text":"Son solo dos sesiones: un mal día, o uno especialmente bueno, mueven el resultado por completo."},{"key":"docs.metricGroups.volume","text":"Volumen"},{"key":"metrics.volume.name","text":"Volumen"},{"key":"metrics.volume.what","text":"Suma los kilos totales que has movido en una sesión. Sirve para comparar la cantidad de trabajo entre sesiones parecidas."},{"key":"metrics.volume.formula","text":"volumen = suma de (peso × repeticiones) de cada serie registrada"},{"key":"metrics.volume.rules","text":"Cuenta también las sub-series de los dropsets."},{"key":"metrics.volume.caveat","text":"Los ejercicios de peso corporal cuentan como 0 kg de volumen porque no tienen un peso externo registrado. Una sesión de dominadas y fondos puede salir con muy poco volumen aunque haya sido dura."},{"key":"metrics.setsDonePlanned.name","text":"Series hechas y planificadas"},{"key":"metrics.setsDonePlanned.what","text":"Muestra cuántas series registraste frente a las que tenía la sesión, para ver si la completaste."}],"warn":["012 (Documentación): «For time: un trabajo fijo, lo más rápido posible.» — término en inglés. (012b-documentacion.png)","012 (Documentación): «Recomendación de progresión … (SIMPLIFICADO)» — revisar."]},{"id":"012h-documentacion","num":"012h","title":"Documentación · 8","texts":[{"key":"header.sectionAccount","text":"CUENTA"},{"key":"docs.title","text":"Documentación"},{"key":"metrics.volume.caveat","text":"Los ejercicios de peso corporal cuentan como 0 kg de volumen porque no tienen un peso externo registrado. Una sesión de dominadas y fondos puede salir con muy poco volumen aunque haya sido dura."},{"key":"metrics.setsDonePlanned.name","text":"Series hechas y planificadas"},{"key":"metrics.setsDonePlanned.what","text":"Muestra cuántas series registraste frente a las que tenía la sesión, para ver si la completaste."},{"key":"docs.metricFormula","text":"Cómo se calcula"},{"key":"metrics.setsDonePlanned.formula","text":"hechas = series con datos registrados o marcadas · planificadas = suma de las series de la plantilla"},{"key":"docs.metricRules","text":"Reglas de la app"},{"key":"metrics.setsDonePlanned.rules","text":"Las planificadas se congelan al guardar la sesión. Un ejercicio que te saltas desaparece de la sesión guardada, pero sus series siguen contando en las planificadas: eso es lo que hace visible el hueco."},{"key":"docs.metricCaveat","text":"Límites"},{"key":"metrics.setsDonePlanned.caveat","text":"Una serie marcada sin datos cuenta como hecha igual que una con peso y repeticiones."},{"key":"metrics.volumeTrend.name","text":"Volumen (pestaña Progreso)"},{"key":"metrics.volumeTrend.what","text":"Compara el volumen de la primera sesión del período con el de la última."},{"key":"metrics.volumeTrend.formula","text":"(volumen de la última sesión − volumen de la primera) ÷ volumen de la primera × 100"},{"key":"metrics.volumeTrend.caveat","text":"No es una línea de tendencia: son dos puntos. Una sesión atípica en cualquiera de los dos extremos cambia el resultado por completo."},{"key":"metrics.muscleGroupSets.name","text":"Series por grupo muscular"},{"key":"metrics.muscleGroupSets.what","text":"Reparte las series de los últimos 7 días entre los grupos musculares, para ver si alguno se está quedando corto."},{"key":"metrics.muscleGroupSets.formula","text":"suma de las series de los ejercicios cuyo grupo muscular principal es ese"},{"key":"metrics.muscleGroupSets.rules","text":"Cuenta volumen directo: un press de banca suma a pecho y no reparte nada a tríceps ni a hombro. Un dropset cuenta como una sola serie. Los grupos que entrenaste en las 4 semanas anteriores pero no en los últimos 7 días aparecen a cero en vez de desaparecer."}],"warn":["012 (Documentación): «For time: un trabajo fijo, lo más rápido posible.» — término en inglés. (012b-documentacion.png)","012 (Documentación): «Recomendación de progresión … (SIMPLIFICADO)» — revisar."]},{"id":"012i-documentacion","num":"012i","title":"Documentación · 9","texts":[{"key":"docs.title","text":"Documentación"},{"key":"metrics.muscleGroupSets.name","text":"Series por grupo muscular"},{"key":"metrics.muscleGroupSets.what","text":"Reparte las series de los últimos 7 días entre los grupos musculares, para ver si alguno se está quedando corto."},{"key":"docs.metricFormula","text":"Cómo se calcula"},{"key":"metrics.muscleGroupSets.formula","text":"suma de las series de los ejercicios cuyo grupo muscular principal es ese"},{"key":"docs.metricRules","text":"Reglas de la app"},{"key":"metrics.muscleGroupSets.rules","text":"Cuenta volumen directo: un press de banca suma a pecho y no reparte nada a tríceps ni a hombro. Un dropset cuenta como una sola serie. Los grupos que entrenaste en las 4 semanas anteriores pero no en los últimos 7 días aparecen a cero en vez de desaparecer."},{"key":"docs.metricCaveat","text":"Límites"},{"key":"metrics.muscleGroupSets.caveat","text":"El rango de referencia de {{min}} a {{max}} series es orientativo para hipertrofia y depende de tu objetivo. Al ignorar el volumen indirecto, los grupos que trabajas sobre todo como secundarios salen más bajos de lo que realmente entrenas."},{"key":"docs.metricGroups.load","text":"Carga"},{"key":"metrics.sessionLoad.name","text":"Carga de la sesión"},{"key":"metrics.sessionLoad.what","text":"Resume en un número cuánto te ha costado una sesión, juntando su duración con lo dura que te pareció. Es la base de todo el panel de Carga."},{"key":"metrics.sessionLoad.formula","text":"carga = sRPE × minutos de sesión"},{"key":"metrics.sessionLoad.rules","text":"Sin responder al sRPE no hay carga: la sesión deja un hueco en las gráficas, nunca un cero. Los bloques de acondicionamiento aportan {{blockFactor}} unidades por segundo activo."},{"key":"metrics.sessionLoad.caveat","text":"Es el método sRPE de Foster. El número no significa nada por sí solo: solo tiene sentido comparado con tus propias sesiones. El factor de los bloques está calibrado a ojo y es la parte menos fiable del cálculo."}],"warn":["012 (Documentación): «For time: un trabajo fijo, lo más rápido posible.» — término en inglés. (012b-documentacion.png)","012 (Documentación): «Recomendación de progresión … (SIMPLIFICADO)» — revisar."]},{"id":"012j-documentacion","num":"012j","title":"Documentación · 10","texts":[{"key":"docs.title","text":"Documentación"},{"key":"metrics.sessionLoad.caveat","text":"Es el método sRPE de Foster. El número no significa nada por sí solo: solo tiene sentido comparado con tus propias sesiones. El factor de los bloques está calibrado a ojo y es la parte menos fiable del cálculo."},{"key":"metrics.sessionMinutes.name","text":"Minutos de sesión"},{"key":"metrics.sessionMinutes.what","text":"Es la duración que se usa para calcular la carga de la sesión."},{"key":"docs.metricFormula","text":"Cómo se calcula"},{"key":"metrics.sessionMinutes.formula","text":"minutos = tiempo real transcurrido, limitado entre la mitad y el doble de la duración estimada"},{"key":"docs.metricRules","text":"Reglas de la app"},{"key":"metrics.sessionMinutes.rules","text":"El tiempo real va desde que empiezas la sesión hasta que la guardas. El límite evita que una sesión que dejaste abierta varias horas multiplique tu carga."},{"key":"docs.metricCaveat","text":"Límites"},{"key":"metrics.sessionMinutes.caveat","text":"Ese tiempo incluye descansos, pausas y el móvil en el bolsillo. Como las series no guardan la hora a la que las hiciste, no existe una medida del tiempo realmente activo."},{"key":"metrics.externalLoad.name","text":"Carga externa"},{"key":"metrics.externalLoad.what","text":"Mide el trabajo que hiciste en repeticiones ponderadas por lo cerca que estuviste de tu máximo. Sirve para comparar sesiones con ejercicios distintos."},{"key":"metrics.externalLoad.formula","text":"carga externa = suma de repeticiones × (peso ÷ 1RM de referencia)"},{"key":"metrics.externalLoad.rules","text":"El 1RM de referencia es tu mejor 1RM estimado de las 6 semanas anteriores a esa sesión, congelado por fecha para que un récord de hoy no reescriba tu historial. Los ejercicios de peso corporal necesitan que hayas registrado tu peso corporal; los isométricos y las series de tiempo no entran, porque no tienen repeticiones."}],"warn":["012 (Documentación): «For time: un trabajo fijo, lo más rápido posible.» — término en inglés. (012b-documentacion.png)","012 (Documentación): «Recomendación de progresión … (SIMPLIFICADO)» — revisar."]},{"id":"012k-documentacion","num":"012k","title":"Documentación · 11","texts":[{"key":"docs.title","text":"Documentación"},{"key":"docs.metricRules","text":"Reglas de la app"},{"key":"metrics.externalLoad.rules","text":"El 1RM de referencia es tu mejor 1RM estimado de las 6 semanas anteriores a esa sesión, congelado por fecha para que un récord de hoy no reescriba tu historial. Los ejercicios de peso corporal necesitan que hayas registrado tu peso corporal; los isométricos y las series de tiempo no entran, porque no tienen repeticiones."},{"key":"docs.metricCaveat","text":"Límites"},{"key":"metrics.externalLoad.caveat","text":"No es tonelaje: normaliza por tu capacidad actual, así que una serie de curl y una de sentadilla a la misma intensidad relativa aportan una carga similar. Al depender del 1RM estimado, hereda su margen de error."},{"key":"metrics.movingAverage.name","text":"Medias de 7 y 28 días"},{"key":"metrics.movingAverage.what","text":"Son las líneas suaves del gráfico de carga: tu carga habitual de la última semana y del último mes. Sirven para ver la forma general por encima del ruido del día a día."},{"key":"docs.metricFormula","text":"Cómo se calcula"},{"key":"metrics.movingAverage.formula","text":"media de la carga diaria de los últimos 7 (o 28) días, contando los días de descanso como 0"},{"key":"metrics.movingAverage.rules","text":"Mientras no tienes 28 días de historial se promedian los días que haya, en vez de dejar la línea sin empezar. Los días en los que entrenaste sin responder al sRPE quedan fuera del promedio en lugar de contar como cero: desconocido no es descanso."},{"key":"metrics.movingAverage.caveat","text":"Una media móvil suaviza, pero también retrasa: un cambio real de carga tarda unos días en verse reflejado en la línea."},{"key":"metrics.loadState.name","text":"Estado de carga"},{"key":"metrics.loadState.what","text":"Resume si estás acumulando carga, manteniéndola estable o descargando."},{"key":"metrics.loadState.formula","text":"media de 7 días ÷ media de 28 días → menos de 0,8 descarga · de 0,8 a 1,3 estable · más de 1,3 acumulación"}],"warn":["012 (Documentación): «For time: un trabajo fijo, lo más rápido posible.» — término en inglés. (012b-documentacion.png)","012 (Documentación): «Recomendación de progresión … (SIMPLIFICADO)» — revisar."]},{"id":"012l-documentacion","num":"012l","title":"Documentación · 12","texts":[{"key":"docs.title","text":"Documentación"},{"key":"metrics.loadState.name","text":"Estado de carga"},{"key":"metrics.loadState.what","text":"Resume si estás acumulando carga, manteniéndola estable o descargando."},{"key":"docs.metricFormula","text":"Cómo se calcula"},{"key":"metrics.loadState.formula","text":"media de 7 días ÷ media de 28 días → menos de 0,8 descarga · de 0,8 a 1,3 estable · más de 1,3 acumulación"},{"key":"docs.metricRules","text":"Reglas de la app"},{"key":"metrics.loadState.rules","text":"Se muestra como estado y no como número a propósito."},{"key":"docs.metricCaveat","text":"Límites"},{"key":"metrics.loadState.caveat","text":"Es la relación agudo/crónico. La versión numérica arrastra artefactos matemáticos conocidos y sus umbrales de riesgo no se replican de forma consistente en los estudios, así que conviene tomarlo como orientación y no como un semáforo."},{"key":"metrics.monotony.name","text":"Monotonía"},{"key":"metrics.monotony.what","text":"Indica si repites la misma carga día tras día sin variación, un patrón asociado a peor recuperación. Cuanto MÁS BAJA, mejor: significa que alternas días duros con días suaves."},{"key":"metrics.monotony.formula","text":"monotonía = media de la carga diaria ÷ su desviación típica, sobre 7 días"},{"key":"metrics.monotony.rules","text":"Los días de descanso cuentan como 0, tal como define el método original. Se oculta cuando la semana tiene menos de {{minSessions}} sesiones. Por encima de {{high}} se marca como alta; por debajo de {{moderate}}, como baja."},{"key":"metrics.monotony.caveat","text":"Con una o dos sesiones en la semana, los días de descanso dominan la desviación y el número deja de significar nada: por eso se oculta en lugar de mostrarse en verde."},{"key":"metrics.strain.name","text":"Strain"},{"key":"metrics.strain.what","text":"Resume el estrés acumulado de la semana juntando cuánta carga hiciste con lo poco que la variaste."}],"warn":["012 (Documentación): «For time: un trabajo fijo, lo más rápido posible.» — término en inglés. (012b-documentacion.png)","012 (Documentación): «Recomendación de progresión … (SIMPLIFICADO)» — revisar."]},{"id":"012m-documentacion","num":"012m","title":"Documentación · 13","texts":[{"key":"docs.title","text":"Documentación"},{"key":"metrics.monotony.caveat","text":"Con una o dos sesiones en la semana, los días de descanso dominan la desviación y el número deja de significar nada: por eso se oculta en lugar de mostrarse en verde."},{"key":"metrics.strain.name","text":"Strain"},{"key":"metrics.strain.what","text":"Resume el estrés acumulado de la semana juntando cuánta carga hiciste con lo poco que la variaste."},{"key":"docs.metricFormula","text":"Cómo se calcula"},{"key":"metrics.strain.formula","text":"strain = carga total de la semana × monotonía"},{"key":"docs.metricRules","text":"Reglas de la app"},{"key":"metrics.strain.rules","text":"Se muestra comparado con tu propio promedio de las 4 semanas anteriores. Se oculta cuando la semana tiene menos de {{minSessions}} sesiones, igual que la monotonía."},{"key":"docs.metricCaveat","text":"Límites"},{"key":"metrics.strain.caveat","text":"No existe un umbral universal de strain, así que nunca se muestra con colores fijos ni con un valor de alarma: solo tiene sentido frente a tu propio historial."},{"key":"metrics.indexed100.name","text":"Base 100"},{"key":"metrics.indexed100.what","text":"Es el reescalado que permite dibujar juntas dos magnitudes con unidades distintas, como la carga externa y el esfuerzo."},{"key":"metrics.indexed100.formula","text":"valor ÷ primer valor del período × 100"},{"key":"metrics.indexed100.rules","text":"El 100 corresponde al principio del período seleccionado, así que cambia al mover el selector."},{"key":"metrics.indexed100.caveat","text":"Si la primera semana del período fue atípica —una descarga, por ejemplo— desplaza toda la serie hacia arriba."},{"key":"metrics.loadHeatmap.name","text":"Mapa de calor del calendario"},{"key":"metrics.loadHeatmap.what","text":"Tiñe cada día del calendario según la carga de la sesión, para localizar de un vistazo tus días duros y tus rachas."}],"warn":["012 (Documentación): «For time: un trabajo fijo, lo más rápido posible.» — término en inglés. (012b-documentacion.png)","012 (Documentación): «Recomendación de progresión … (SIMPLIFICADO)» — revisar."]},{"id":"012n-documentacion","num":"012n","title":"Documentación · 14","texts":[{"key":"docs.title","text":"Documentación"},{"key":"metrics.indexed100.caveat","text":"Si la primera semana del período fue atípica —una descarga, por ejemplo— desplaza toda la serie hacia arriba."},{"key":"metrics.loadHeatmap.name","text":"Mapa de calor del calendario"},{"key":"metrics.loadHeatmap.what","text":"Tiñe cada día del calendario según la carga de la sesión, para localizar de un vistazo tus días duros y tus rachas."},{"key":"docs.metricFormula","text":"Cómo se calcula"},{"key":"metrics.loadHeatmap.formula","text":"cuatro escalones repartidos por cuartiles de tu propia carga diaria"},{"key":"docs.metricRules","text":"Reglas de la app"},{"key":"metrics.loadHeatmap.rules","text":"Los cortes se calculan sobre todo tu historial, no sobre el mes visible, para que al cambiar de mes signifiquen lo mismo. Un día entrenado sin responder al sRPE se dibuja con contorno y sin relleno, porque no hay carga que representar."},{"key":"docs.metricCaveat","text":"Límites"},{"key":"metrics.loadHeatmap.caveat","text":"El color ordena tus días entre sí, no contra un valor absoluto: siempre habrá días oscuros y días claros aunque entrenes de forma muy uniforme."},{"key":"docs.metricGroups.session","text":"Sesión y plan"},{"key":"metrics.sessionCount.name","text":"Sesiones"},{"key":"metrics.sessionCount.what","text":"Cuenta las sesiones que has completado dentro del período seleccionado. Sirve para saber si estás manteniendo el ritmo."},{"key":"metrics.sessionCount.formula","text":"número de sesiones guardadas dentro del período"},{"key":"metrics.sessionCount.rules","text":"Responde al selector de período y al filtro de programa. El subtítulo «esta semana», en cambio, siempre cuenta la semana natural en curso, de lunes a domingo, con independencia del período elegido."},{"key":"metrics.sessionCount.caveat","text":"Cuenta sesiones, no su tamaño: un calentamiento de diez minutos y una sesión de dos horas suman lo mismo."}],"warn":["012 (Documentación): «For time: un trabajo fijo, lo más rápido posible.» — término en inglés. (012b-documentacion.png)","012 (Documentación): «Recomendación de progresión … (SIMPLIFICADO)» — revisar."]},{"id":"012o-documentacion","num":"012o","title":"Documentación · 15","texts":[{"key":"docs.title","text":"Documentación"},{"key":"metrics.progressionChip.what","text":"Es la sugerencia de subir, mantener o bajar que aparece en cada ejercicio durante el entrenamiento, a partir de cómo te fue la última vez."},{"key":"docs.metricFormulaApprox","text":"Cómo se calcula (simplificado)"},{"key":"metrics.progressionChip.formula","text":"series válidas ÷ series objetivo, cruzado con el rango de repeticiones y con el RPE si lo registras"},{"key":"docs.metricRules","text":"Reglas de la app"},{"key":"metrics.progressionChip.rules","text":"Una serie válida es la que alcanzó el mínimo de repeticiones (o de tiempo) del ejercicio; una serie marcada como hecha sin datos también cuenta. Con el modo de evaluación por RPE, subir exige además que el RPE promedio no supere el techo que hayas fijado."},{"key":"docs.metricCaveat","text":"Límites"},{"key":"metrics.progressionChip.caveat","text":"Mira solo tu última sesión de ese ejercicio, no tu evolución. Es una sugerencia: ignorarla no afecta a nada más."},{"key":"metrics.estimatedDuration.name","text":"Duración estimada"},{"key":"metrics.estimatedDuration.what","text":"Calcula cuánto va a durar una sesión antes de hacerla, para poder ajustarla al tiempo del que dispones."},{"key":"docs.metricFormula","text":"Cómo se calcula"},{"key":"metrics.estimatedDuration.formula","text":"series × (35 s + descanso) + 180 s por ejercicio + 480 s de calentamiento general"},{"key":"metrics.estimatedDuration.rules","text":"Los 180 segundos por ejercicio cubren la transición: buscar la máquina, montar el peso, ajustar. En superseries se cuenta el descanso completo de cada miembro."},{"key":"metrics.estimatedDuration.caveat","text":"Es un modelo, no una medida: asume que respetas los descansos configurados y no sabe si te entretienes entre series. En superseries sobreestima algo."},{"key":"metrics.warmupWeight.name","text":"Pesos de calentamiento"},{"key":"metrics.warmupWeight.what","text":"Propone los pesos de las series de aproximación a partir del peso de trabajo del día."},{"key":"metrics.warmupWeight.formula","text":"peso = porcentaje del peso de trabajo del día, redondeado a 2,5 kg"}],"warn":["012 (Documentación): «For time: un trabajo fijo, lo más rápido posible.» — término en inglés. (012b-documentacion.png)","012 (Documentación): «Recomendación de progresión … (SIMPLIFICADO)» — revisar."]},{"id":"012p-documentacion","num":"012p","title":"Documentación · 16","texts":[{"key":"docs.title","text":"Documentación"},{"key":"metrics.warmupWeight.name","text":"Pesos de calentamiento"},{"key":"metrics.warmupWeight.what","text":"Propone los pesos de las series de aproximación a partir del peso de trabajo del día."},{"key":"docs.metricFormula","text":"Cómo se calcula"},{"key":"metrics.warmupWeight.formula","text":"peso = porcentaje del peso de trabajo del día, redondeado a 2,5 kg"},{"key":"docs.metricRules","text":"Reglas de la app"},{"key":"metrics.warmupWeight.rules","text":"El peso de trabajo sale de la prescripción del entrenador o, si no la hay, de tu serie más pesada la última vez. Sin ninguna de las dos, las pills salen vacías hasta que escribas tu primer peso. No se guardan en el historial."},{"key":"docs.metricCaveat","text":"Límites"},{"key":"metrics.warmupWeight.caveat","text":"Son orientativos: el porcentaje no distingue entre ejercicios ni tiene en cuenta cómo te encuentras ese día."},{"key":"metrics.blockDelta.name","text":"Comparación de bloques"},{"key":"metrics.blockDelta.what","text":"Indica si mejoraste respecto a la última vez que hiciste ese mismo bloque de acondicionamiento."},{"key":"metrics.blockDelta.formula","text":"AMRAP: rondas y repeticiones · EMOM: rondas completadas · For time: tiempo"},{"key":"metrics.blockDelta.rules","text":"En los bloques for time menos tiempo es mejor, así que el signo va invertido respecto a los otros dos formatos. Se compara contra la vez anterior de la misma sesión, no contra tu mejor resultado."},{"key":"metrics.blockDelta.caveat","text":"Los bloques no registran el peso usado, así que dos resultados iguales con cargas distintas se comparan como si fueran equivalentes."},{"key":"metrics.stageProgress.name","text":"Progreso de etapa"},{"key":"metrics.stageProgress.what","text":"En qué semana de la etapa vas y cuántas sesiones llevas, para saber cuánto te queda y si hace falta alargarla."}],"warn":["012 (Documentación): «For time: un trabajo fijo, lo más rápido posible.» — término en inglés. (012b-documentacion.png)","012 (Documentación): «Recomendación de progresión … (SIMPLIFICADO)» — revisar."]},{"id":"012q-documentacion","num":"012q","title":"Documentación · 17","texts":[{"key":"docs.title","text":"Documentación"},{"key":"metrics.blockDelta.caveat","text":"Los bloques no registran el peso usado, así que dos resultados iguales con cargas distintas se comparan como si fueran equivalentes."},{"key":"metrics.stageProgress.name","text":"Progreso de etapa"},{"key":"metrics.stageProgress.what","text":"En qué semana de la etapa vas y cuántas sesiones llevas, para saber cuánto te queda y si hace falta alargarla."},{"key":"docs.metricFormula","text":"Cómo se calcula"},{"key":"metrics.stageProgress.formula","text":"semana de la etapa = semanas de calendario desde el lunes de la semana 1 · sesiones esperadas = semanas × sesiones de la etapa" :"Zona lumbar"},{"key":"onboarding.limitations.knee.label","text":"Rodilla"},{"key":"onboarding.adjustSheet.limitationsHintNone","text":"Sin limitaciones activas."}],"warn":[]}]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const screens = DATA.areas.flatMap(a => a.screens.map(s => ({ ...s, area: a.name })));
const notes = {};            // id → { text, at }
let db = null, cur = 0;
const $ = s => document.querySelector(s);
const idOf = (s, t) => t.key ? 'k_' + t.key.replace(/[^\w]/g, '_') : 'h_' + s.id + '_' + t.text.slice(0, 40).replace(/[^\w]/g, '_');
const keyScreens = {};       // clave → pantallas donde sale
screens.forEach(s => s.texts.forEach(t => { if (t.key) (keyScreens[t.key] ||= []).push(s.id) }));

function changedIn(s) { return s.texts.filter(t => notes[idOf(s, t)]?.text).length }
function renderNav() {
  const total = Object.values(notes).filter(n => n.text).length;
  $('#count').textContent = `${screens.length} pantallas · ${total} cambio${total === 1 ? '' : 's'}`;
  $('#nav').innerHTML = DATA.areas.map(a => `<h3>${esc(a.name)}</h3>` + a.screens.map(s => {
    const i = screens.findIndex(x => x.id === s.id), c = changedIn(screens[i]);
    return `<a href="#${s.id}" class="${i === cur ? 'on' : ''}"><span class="n">${esc(s.num)}</span><span>${esc(s.title)}</span>${c ? `<span class="b">${c}</span>` : ''}</a>`;
  }).join('')).join('');
  $('#jump').innerHTML = screens.map((s, i) => `<option value="${i}" ${i === cur ? 'selected' : ''}>${esc(s.area)} · ${esc(s.title)}</option>`).join('');
}
function renderScreen() {
  const s = screens[cur];
  $('#main').innerHTML = `
    <div class="head"><span class="area">${esc(s.area)}</span><h2>${esc(s.title)}</h2><span class="pos">${cur + 1}/${screens.length}</span>
      <span class="nav2"><button class="btn" id="prev" ${cur ? '' : 'disabled'}>← Anterior</button><button class="btn primary" id="next" ${cur < screens.length - 1 ? '' : 'disabled'}>Siguiente →</button></span></div>
    <div class="screen">
      <div class="shot" id="shot"><img src="img/${s.id}.jpg" alt="Captura: ${esc(s.title)}"><span class="hint">ampliar</span></div>
      <div>
        ${s.warn.length ? `<div class="warn"><b>Posibles problemas detectados</b><ul>${s.warn.map(w => `<li>${esc(w)}</li>`).join('')}</ul></div>` : ''}
        <div class="texts">${s.texts.length ? s.texts.map((t, j) => {
          const id = idOf(s, t), n = notes[id], also = t.key ? keyScreens[t.key].filter(x => x !== s.id).length : 0;
          return `<div class="t ${n?.text ? 'changed' : ''}">
            <div class="orig">${esc(t.text)}</div>
            <div class="meta">${t.key ? esc(t.key) : '<span class="hard">texto fijo en el código</span>'}${also ? `<span class="also">· sale en ${also} pantalla${also > 1 ? 's' : ''} más</span>` : ''}</div>
            <textarea id="ta-${j}" data-id="${id}" data-key="${esc(t.key || '')}" data-orig="${esc(t.text)}" rows="1" placeholder="Versión nueva (déjalo vacío si está bien)">${esc(n?.text || '')}</textarea>
          </div>`;
        }).join('') : '<p class="empty">No hay textos de la app en esta captura.</p>'}</div>
      </div>
    </div>`;
  $('#prev').onclick = () => go(cur - 1);
  $('#next').onclick = () => go(cur + 1);
  $('#shot').onclick = () => { $('#zoom img').src = `img/${s.id}.jpg`; $('#zoom').hidden = false };
  document.querySelectorAll('textarea').forEach(ta => { fit(ta); ta.oninput = () => { fit(ta); save(ta) } });
}
function go(i) { if (i < 0 || i >= screens.length) return; location.hash = screens[i].id }
function fromHash() { const i = screens.findIndex(s => s.id === location.hash.slice(1)); cur = i < 0 ? 0 : i; renderNav(); renderScreen(); window.scrollTo(0, 0) }
function fit(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px' }
const timers = {};
function save(ta) {
  const id = ta.dataset.id, text = ta.value.trim();
  notes[id] = { text, key: ta.dataset.key, orig: ta.dataset.orig, screen: screens[cur].id, at: Date.now() };
  ta.closest('.t').classList.toggle('changed', !!text);
  clearTimeout(timers[id]);
  timers[id] = setTimeout(async () => {
    try { localStorage.setItem('copy-notas', JSON.stringify(notes)) } catch (e) {}
    if (!db) return;
    $('#status').textContent = 'Guardando…';
    try {
      const ref = db.collection('notas').doc(id);
      text ? await ref.set(notes[id]) : await ref.delete();
      $('#status').textContent = 'Guardado';
    } catch (e) { $('#status').textContent = e.code === 'not_granted' ? 'Solo lectura' : 'No se pudo guardar' }
  }, 700);
  renderNavLight();
}
let navT; function renderNavLight() { clearTimeout(navT); navT = setTimeout(renderNav, 300) }

$('#copy').onclick = () => {
  const rows = Object.values(notes).filter(n => n.text).sort((a, b) => a.screen.localeCompare(b.screen));
  const txt = rows.length ? rows.map(n => `- ${n.key ? '`' + n.key + '`' : '(fijo en ' + n.screen + ')'}\n  antes: ${n.orig}\n  nuevo: ${n.text}`).join('\n') : '(sin cambios)';
  const done = () => { $('#copy').textContent = 'Copiado ✓'; setTimeout(() => $('#copy').textContent = 'Copiar cambios', 1500) };
  navigator.clipboard.writeText(txt).then(done, () => { const ta = document.createElement('textarea'); ta.value = txt; document.body.append(ta); ta.select(); try { document.execCommand('copy'); done() } catch (e) {} ta.remove() });
};
$('#jump').onchange = e => go(+e.target.value);
$('#zoom').onclick = () => $('#zoom').hidden = true;
addEventListener('hashchange', fromHash);
addEventListener('keydown', e => {
  if (e.target.matches('textarea, select')) return;
  if (e.key === 'Escape') $('#zoom').hidden = true;
  if (e.key === 'ArrowRight') go(cur + 1);
  if (e.key === 'ArrowLeft') go(cur - 1);
});
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])) }

try { Object.assign(notes, JSON.parse(localStorage.getItem('copy-notas')) || {}) } catch (e) {}
fromHash();

// Notas compartidas: todos los que abren la página ven y editan las mismas.
(async () => {
  try { db = await window.claude?.use?.('db') } catch (e) {}
  if (!db) { $('#status').textContent = 'Notas solo en este navegador'; return }
  db.collection('notas').onSnapshot(snap => {
    for (const k in notes) delete notes[k];
    snap.docs.forEach(d => { notes[d.id] = d.data() });
    renderNav();
    // No pisar lo que se está escribiendo: solo se refrescan las cajas sin foco.
    document.querySelectorAll('textarea').forEach(ta => {
      if (ta === document.activeElement) return;
      ta.value = notes[ta.dataset.id]?.text || ''; fit(ta);
      ta.closest('.t').classList.toggle('changed', !!ta.value);
    });
  }, () => { $('#status').textContent = 'Sin conexión a las notas' });
})();
</script>
